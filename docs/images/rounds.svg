<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rounds-github-title rounds-github-desc" id="rounds-github-root">
<title id="rounds-github-title">Life of a blocking finding across rounds</title>
<desc id="rounds-github-desc">Each push starts a new round. A blocking finding is fixed or carried over. A new HIGH finding on a file this push did not change is shown as MEDIUM and does not block.</desc>
<defs>
      <style>#rounds-github-root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #1F2328; }
      #rounds-github-root .page { max-width: 1000px; width: 100%; }
      #rounds-github-root .diagram-container { width: 100%; overflow-x: auto; }
      #rounds-github-root .diagram-container { overflow-x: visible; }
      #rounds-github-root .bg { fill: #FFFFFF; }
      #rounds-github-root .edge-frame { fill: none; stroke: #818B98; stroke-width: 2; }
      #rounds-github-root text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2328; font-size: 12px; }
      #rounds-github-root .t-name { font-size: 14px; font-weight: 600; }
      #rounds-github-root .t-name-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; }
      #rounds-github-root .t-sub { fill: #59636E; }
      #rounds-github-root .t-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      #rounds-github-root .t-eye { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .12em; fill: #59636E; }
      #rounds-github-root .t-arrow { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .06em; fill: #59636E; }
      #rounds-github-root .t-alert { fill: #D1242F; font-weight: 700; }
      #rounds-github-root .t-chip { fill: #FFFFFF; font-weight: 700; }
      #rounds-github-root .t-title { font-size: 14px; font-weight: 700; }
      #rounds-github-root .mask { fill: #FFFFFF; }
      #rounds-github-root .node { fill: #F6F8FA; stroke: #818B98; stroke-width: 1.2; }
      #rounds-github-root .raised { fill: #FFFFFF; stroke: #818B98; stroke-width: 1; }
      #rounds-github-root .hero { fill: #DDF4FF; stroke: #0969DA; stroke-width: 2.4; }
      #rounds-github-root .optional { fill: none; stroke: #818B98; stroke-width: 1.2; stroke-dasharray: 5 4; }
      #rounds-github-root .zone { fill: none; stroke: #818B98; stroke-width: 1; stroke-dasharray: 4 4; }
      #rounds-github-root .strip { fill: #F6F8FA; stroke: #818B98; stroke-width: 1.2; }
      #rounds-github-root .bar { fill: #CF222E; }
      #rounds-github-root .alert-node { fill: #FFFFFF; stroke: #CF222E; stroke-width: 2; stroke-dasharray: 6 4; }
      #rounds-github-root .edge { fill: none; stroke: #0969DA; stroke-width: 1.6; }
      #rounds-github-root .edge-dash { fill: none; stroke: #0969DA; stroke-width: 1.4; stroke-dasharray: 5 4; }
      #rounds-github-root .edge-alert { fill: none; stroke: #CF222E; stroke-width: 1.6; }
      #rounds-github-root .mk { fill: #0969DA; }
      #rounds-github-root .mk-alert { fill: #CF222E; }
      #rounds-github-root .chip { fill: #25292E; }
      #rounds-github-root .dot { fill: #1F2328; }
      #rounds-github-root .bullet { fill: #59636E; }
      #rounds-github-root .diamond { fill: #FFFFFF; stroke: #818B98; stroke-width: 1.4; }</style>
<marker id="rounds-github-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk" points="0 0, 8 3, 0 6"/></marker>
<marker id="rounds-github-arrow-alert" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk-alert" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="bg" width="880" height="544"/>
<rect class="edge-frame" x="1" y="1" width="878" height="542" rx="8"/>
<g transform="translate(0,-76)">
<path class="edge" d="M54,148 H120" marker-end="url(#rounds-github-arrow)"/>
<path class="edge-dash" d="M48,154 V404" marker-end="url(#rounds-github-arrow)"/>
<path class="edge" d="M320,148 H632" marker-end="url(#rounds-github-arrow)"/>
<path class="edge-alert" d="M220,192 V292 Q220,300 228,300 H392" marker-end="url(#rounds-github-arrow-alert)"/>
<path class="edge" d="M632,300 H744 Q752,300 752,292 V192" marker-end="url(#rounds-github-arrow)"/>
<path class="edge-alert" d="M480,348 V372 Q480,380 488,380 H528 Q536,380 536,372 V348" marker-end="url(#rounds-github-arrow-alert)"/>
<rect class="mask" x="452" y="124" width="48" height="16" rx="2"/><text class="t-arrow" x="476" y="136" text-anchor="middle">FIXED</text>
<rect class="mask" x="271" y="278" width="78" height="16" rx="2"/><text class="t-arrow" x="310" y="290" text-anchor="middle">NOT FIXED</text>
<rect class="mask" x="666" y="276" width="48" height="16" rx="2"/><text class="t-arrow" x="690" y="288" text-anchor="middle">FIXED</text>
<rect class="mask" x="469" y="388" width="78" height="16" rx="2"/><text class="t-arrow" x="508" y="400" text-anchor="middle">NOT FIXED</text>
<rect class="mask" x="58" y="268" width="78" height="16" rx="2"/><text class="t-arrow" x="97" y="280" text-anchor="middle">LATE HIGH</text>
<text class="t-eye" x="24" y="112">NEW FINDING</text>
<circle class="dot" cx="48" cy="148" r="6"/>
<g class="focal" data-box="120 104 200 88">
<rect class="raised focal-r" x="120" y="104" width="200" height="88" rx="6"/>
<text class="t-name" x="132" y="126" textLength="59.1" lengthAdjust="spacing">Blocking</text>
<text class="t-sub" y="146" data-r="308"><tspan x="132">A</tspan><tspan x="144.1" textLength="54.7" lengthAdjust="spacing">CRITICAL</tspan><tspan x="202.9" textLength="10.7" lengthAdjust="spacing">or</tspan><tspan x="217.7" textLength="30.0" lengthAdjust="spacing">HIGH</tspan><tspan x="251.9" textLength="35.4" lengthAdjust="spacing">finding</tspan><tspan x="291.3" textLength="16.7" lengthAdjust="spacing">the</tspan></text>
<text class="t-sub" y="162"><tspan x="132" textLength="49.3" lengthAdjust="spacing">comment</tspan><tspan x="184.7" textLength="20.7" lengthAdjust="spacing">lists</tspan><tspan x="208.7" textLength="12.7" lengthAdjust="spacing">as</tspan><tspan x="224.7" textLength="47.4" lengthAdjust="spacing">blocking.</tspan></text>
</g>
<g data-box="632 104 224 88">
<rect class="raised" x="632" y="104" width="224" height="88" rx="6"/>
<text class="t-name" x="644" y="126" textLength="36.6" lengthAdjust="spacing">Fixed</text>
<text class="t-sub" y="146" data-r="844"><tspan x="644" textLength="20.7" lengthAdjust="spacing">The</tspan><tspan x="671" textLength="32.7" lengthAdjust="spacing">model</tspan><tspan x="710" textLength="32.7" lengthAdjust="spacing">marks</tspan><tspan x="749" textLength="6.0" lengthAdjust="spacing">it</tspan><tspan x="761.3" textLength="28.7" lengthAdjust="spacing">fixed.</tspan><tspan x="796.3" textLength="6.7" lengthAdjust="spacing">It</tspan><tspan x="809.3" textLength="34.7" lengthAdjust="spacing">leaves</tspan></text>
<text class="t-sub" y="162"><tspan x="644" textLength="16.7" lengthAdjust="spacing">the</tspan><tspan x="664" textLength="44.0" lengthAdjust="spacing">blocking</tspan><tspan x="711.4" textLength="18.0" lengthAdjust="spacing">list.</tspan></text>
</g>
<g data-box="392 252 240 96">
<rect class="alert-node" x="392" y="252" width="240" height="96" rx="6"/>
<text class="t-name" x="404" y="274" textLength="82.5" lengthAdjust="spacing">Carried over</text>
<text class="t-sub" y="294" data-r="620"><tspan x="404" textLength="20.7" lengthAdjust="spacing">The</tspan><tspan x="432.9" textLength="32.7" lengthAdjust="spacing">model</tspan><tspan x="473.8" textLength="40.0" lengthAdjust="spacing">repeats</tspan><tspan x="522" textLength="6.0" lengthAdjust="spacing">it</tspan><tspan x="536.2" textLength="21.3" lengthAdjust="spacing">with</tspan><tspan x="565.8" textLength="16.7" lengthAdjust="spacing">the</tspan><tspan x="590.7" textLength="29.3" lengthAdjust="spacing">prefix</tspan></text>
<text class="t-sub" y="310"><tspan x="404" class="t-code" textLength="50.5" lengthAdjust="spacing">Carried</tspan><tspan x="461.8" class="t-code" textLength="36.1" lengthAdjust="spacing">over:</tspan><tspan x="501.2" textLength="34.0" lengthAdjust="spacing">before</tspan><tspan x="538.5" textLength="9.3" lengthAdjust="spacing">it.</tspan><tspan x="551.2" textLength="6.7" lengthAdjust="spacing">It</tspan><tspan x="561.2" textLength="17.3" lengthAdjust="spacing">still</tspan><tspan x="581.8" textLength="37.3" lengthAdjust="spacing">blocks.</tspan></text>
</g>
<g data-box="24 404 304 96">
<rect class="optional" x="24" y="404" width="304" height="96" rx="6"/>
<text class="t-name" x="36" y="426" textLength="84.8" lengthAdjust="spacing">Not blocking</text>
<text class="t-sub" y="446" data-r="316"><tspan x="36">A</tspan><tspan x="50.8" textLength="22.0" lengthAdjust="spacing">new</tspan><tspan x="79.6" textLength="30.0" lengthAdjust="spacing">HIGH</tspan><tspan x="116.4" textLength="13.3" lengthAdjust="spacing">on</tspan><tspan x="136.5">a</tspan><tspan x="150" textLength="15.3" lengthAdjust="spacing">file</tspan><tspan x="172.1" textLength="18.7" lengthAdjust="spacing">this</tspan><tspan x="197.6" textLength="26.0" lengthAdjust="spacing">push</tspan><tspan x="230.4" textLength="16.0" lengthAdjust="spacing">did</tspan><tspan x="253.2" textLength="16.7" lengthAdjust="spacing">not</tspan><tspan x="276.6" textLength="39.4" lengthAdjust="spacing">change</tspan></text>
<text class="t-sub" y="462" data-r="316"><tspan x="36" textLength="20.0" lengthAdjust="spacing">and</tspan><tspan x="60.8" textLength="13.3" lengthAdjust="spacing">no</tspan><tspan x="79" textLength="33.4" lengthAdjust="spacing">earlier</tspan><tspan x="117.2" textLength="30.7" lengthAdjust="spacing">round</tspan><tspan x="152.7" textLength="28.7" lengthAdjust="spacing">cited.</tspan><tspan x="186.2" textLength="32.0" lengthAdjust="spacing">Listed</tspan><tspan x="223" textLength="12.7" lengthAdjust="spacing">as</tspan><tspan x="240.5" textLength="52.0" lengthAdjust="spacing">MEDIUM.</tspan><tspan x="297.3" textLength="18.7" lengthAdjust="spacing">Not</tspan></text>
<text class="t-sub" y="478"><tspan x="36" textLength="36.7" lengthAdjust="spacing">carried</tspan><tspan x="76" textLength="26.7" lengthAdjust="spacing">over.</tspan></text>
</g>
<rect class="mask" x="59" y="126" width="56" height="16" rx="2"/><text class="t-arrow" x="87" y="138" text-anchor="middle">BLOCKS</text>
<g data-box="352 424 504 80">
<rect class="strip" x="352" y="424" width="504" height="80" rx="6"/>
<text class="t-title" x="368" y="448" textLength="267.5" lengthAdjust="spacing">Each transition happens on a new push.</text>
<text class="t-sub" y="468" data-r="840"><tspan x="368" textLength="20.7" lengthAdjust="spacing">The</tspan><tspan x="393.3" textLength="32.7" lengthAdjust="spacing">model</tspan><tspan x="430.7" textLength="32.7" lengthAdjust="spacing">marks</tspan><tspan x="468" textLength="26.0" lengthAdjust="spacing">each</tspan><tspan x="498.7" textLength="33.4" lengthAdjust="spacing">earlier</tspan><tspan x="536.7" textLength="38.7" lengthAdjust="spacing">blocker</tspan><tspan x="580" textLength="25.3" lengthAdjust="spacing">fixed</tspan><tspan x="610" textLength="10.7" lengthAdjust="spacing">or</tspan><tspan x="625.3" textLength="40.0" lengthAdjust="spacing">repeats</tspan><tspan x="670" textLength="9.3" lengthAdjust="spacing">it.</tspan><tspan x="684" textLength="20.7" lengthAdjust="spacing">The</tspan><tspan x="709.3" textLength="42.7" lengthAdjust="spacing">harness</tspan><tspan x="756.7" textLength="26.0" lengthAdjust="spacing">does</tspan><tspan x="787.3" textLength="16.7" lengthAdjust="spacing">not</tspan><tspan x="808.7" textLength="31.3" lengthAdjust="spacing">check</tspan></text>
<text class="t-sub" y="484"><tspan x="368" textLength="22.0" lengthAdjust="spacing">this.</tspan><tspan x="393.3" textLength="54.7" lengthAdjust="spacing">CRITICAL</tspan><tspan x="451.3" textLength="8.7" lengthAdjust="spacing">is</tspan><tspan x="463.3" textLength="30.0" lengthAdjust="spacing">never</tspan><tspan x="496.7" textLength="45.4" lengthAdjust="spacing">lowered.</tspan></text>
</g>
<g data-box="24 524 832 72">
<rect class="strip" x="24" y="524" width="832" height="72" rx="6"/>
<text class="t-title" x="40" y="548" textLength="508.7" lengthAdjust="spacing">A PR merged while its verdict is changes requested gets one alert comment.</text>
<text class="t-sub" y="568"><tspan x="40">A</tspan><tspan x="51.3" textLength="30.7" lengthAdjust="spacing">round</tspan><tspan x="85.3" textLength="21.3" lengthAdjust="spacing">with</tspan><tspan x="110" textLength="13.3" lengthAdjust="spacing">no</tspan><tspan x="126.7" textLength="44.0" lengthAdjust="spacing">blocking</tspan><tspan x="174" textLength="41.4" lengthAdjust="spacing">findings</tspan><tspan x="218.7" textLength="28.7" lengthAdjust="spacing">posts</tspan><tspan x="250.7" textLength="54.7" lengthAdjust="spacing">Approved.</tspan><tspan x="308.7" textLength="48.7" lengthAdjust="spacing">MEDIUM</tspan><tspan x="360.7" textLength="20.0" lengthAdjust="spacing">and</tspan><tspan x="384.1" textLength="27.3" lengthAdjust="spacing">LOW</tspan><tspan x="414.7" textLength="41.4" lengthAdjust="spacing">findings</tspan><tspan x="459.4" textLength="22.0" lengthAdjust="spacing">stay</tspan><tspan x="484.7" textLength="31.3" lengthAdjust="spacing">listed.</tspan></text>
</g>
</g>
</svg>
