<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 756" xmlns="http://www.w3.org/2000/svg" xml:lang="zh-TW" role="img" aria-labelledby="round-github-zh-dark-title round-github-zh-dark-desc" id="round-github-zh-dark-root">
<title id="round-github-zh-dark-title">一輪審查的七個步驟</title>
<desc id="round-github-zh-dark-desc">一輪審查有七個步驟：Pick、Scan、Build、Slice、Review、Verify 與 Post。步驟 1 到 4 不呼叫模型。若掃描命中，或掃描無法執行，工具貼出 Review withheld 通知，不審查該 PR。無法解析的輸出不貼出。</desc>
<defs>
      <style>#round-github-zh-dark-root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", Helvetica, Arial, sans-serif; color: #F0F6FC; }
      #round-github-zh-dark-root .page { max-width: 1000px; width: 100%; }
      #round-github-zh-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #round-github-zh-dark-root .diagram-container { overflow-x: visible; }
      #round-github-zh-dark-root .bg { fill: #0D1117; }
      #round-github-zh-dark-root .edge-frame { fill: none; stroke: #656C76; stroke-width: 2; }
      #round-github-zh-dark-root text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", Helvetica, Arial, sans-serif; fill: #F0F6FC; font-size: 12px; }
      #round-github-zh-dark-root .t-name { font-size: 14px; font-weight: 600; }
      #round-github-zh-dark-root .t-name-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; }
      #round-github-zh-dark-root .t-sub { fill: #9198A1; }
      #round-github-zh-dark-root .t-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      #round-github-zh-dark-root .t-eye { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", Helvetica, Arial, sans-serif; font-size: 11px; letter-spacing: .08em; fill: #9198A1; }
      #round-github-zh-dark-root .t-arrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", Helvetica, Arial, sans-serif; font-size: 11px; letter-spacing: .04em; fill: #9198A1; }
      #round-github-zh-dark-root .t-alert { fill: #F85149; font-weight: 700; }
      #round-github-zh-dark-root .t-chip { fill: #0D1117; font-weight: 700; }
      #round-github-zh-dark-root .t-title { font-size: 14px; font-weight: 700; }
      #round-github-zh-dark-root .mask { fill: #0D1117; }
      #round-github-zh-dark-root .node { fill: #151B23; stroke: #656C76; stroke-width: 1.2; }
      #round-github-zh-dark-root .raised { fill: #0D1117; stroke: #656C76; stroke-width: 1; }
      #round-github-zh-dark-root .hero { fill: #111D2E; stroke: #4493F8; stroke-width: 2.4; }
      #round-github-zh-dark-root .optional { fill: none; stroke: #656C76; stroke-width: 1.2; stroke-dasharray: 5 4; }
      #round-github-zh-dark-root .zone { fill: none; stroke: #656C76; stroke-width: 1; stroke-dasharray: 4 4; }
      #round-github-zh-dark-root .strip { fill: #151B23; stroke: #656C76; stroke-width: 1.2; }
      #round-github-zh-dark-root .bar { fill: #DA3633; }
      #round-github-zh-dark-root .alert-node { fill: #0D1117; stroke: #DA3633; stroke-width: 2; stroke-dasharray: 6 4; }
      #round-github-zh-dark-root .edge { fill: none; stroke: #4493F8; stroke-width: 1.6; }
      #round-github-zh-dark-root .edge-dash { fill: none; stroke: #4493F8; stroke-width: 1.4; stroke-dasharray: 5 4; }
      #round-github-zh-dark-root .edge-alert { fill: none; stroke: #DA3633; stroke-width: 1.6; }
      #round-github-zh-dark-root .mk { fill: #4493F8; }
      #round-github-zh-dark-root .mk-alert { fill: #DA3633; }
      #round-github-zh-dark-root .chip { fill: #F0F6FC; }
      #round-github-zh-dark-root .dot { fill: #F0F6FC; }
      #round-github-zh-dark-root .bullet { fill: #9198A1; }
      #round-github-zh-dark-root .diamond { fill: #0D1117; stroke: #656C76; stroke-width: 1.4; }</style>
<marker id="round-github-zh-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk" points="0 0, 8 3, 0 6"/></marker>
<marker id="round-github-zh-dark-arrow-alert" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk-alert" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="bg" width="880" height="756"/>
<rect class="edge-frame" x="1" y="1" width="878" height="754" rx="8"/>
<g transform="translate(0,-0)">
<rect class="zone" x="24" y="24" width="832" height="338" rx="8"/>
<text class="t-eye" x="840" y="46" text-anchor="end">不呼叫模型</text>
<rect class="zone" x="24" y="386" width="832" height="162" rx="8"/>
<text class="t-eye" x="840" y="408" text-anchor="end">呼叫模型</text>
<path class="edge" d="M56,132 V148" marker-end="url(#round-github-zh-dark-arrow)"/>
<path class="edge" d="M56,204 V220" marker-end="url(#round-github-zh-dark-arrow)"/>
<path class="edge" d="M56,292 V308" marker-end="url(#round-github-zh-dark-arrow)"/>
<path class="edge" d="M56,348 V422" marker-end="url(#round-github-zh-dark-arrow)"/>
<path class="edge" d="M56,462 V478" marker-end="url(#round-github-zh-dark-arrow)"/>
<path class="edge" d="M56,534 V580" marker-end="url(#round-github-zh-dark-arrow)"/>
<g data-box="32 60 816 72" data-left="170">
<rect class="raised" x="32" y="60" width="816" height="72" rx="6"/>
<circle class="chip" cx="56" cy="82" r="12"/>
<text class="t-chip" x="56" y="86" text-anchor="middle">1</text>
<text class="t-name" x="80" y="87" textLength="28.8" lengthAdjust="spacing">Pick</text>
<text class="t-sub" y="87" data-r="836"><tspan x="192 204.2 216.4 228.6 240.8 252.8 265 277.2 289.4 301.4 313.6 325.7 337.9">選出開啟中、非草稿，且目前</tspan><tspan x="354.8" textLength="26.7" lengthAdjust="spacing">head</tspan><tspan x="386.4 398.6 410.8 423 435.2">尚無留言的</tspan><tspan x="452.1" textLength="16.7" lengthAdjust="spacing">PR</tspan><tspan x="468.7 480.9 493.1 505.3 517.5 529.7 541.9 554.1 566.3 578.5">。來自不受信任作者的</tspan><tspan x="595.4" textLength="20.0" lengthAdjust="spacing">fork</tspan><tspan x="620.2" textLength="16.7" lengthAdjust="spacing">PR</tspan><tspan x="641.8 654 666 678.2">略過。若</tspan><tspan x="695.1" textLength="26.7" lengthAdjust="spacing">head</tspan><tspan x="726.6 738.8 750.8 763 775.2 787.4 799.6 811.8 824">未變，且上一則審查</tspan></text>
<text class="t-sub" y="103" data-r="836"><tspan x="192 204.1 216.2 228.3 240.4 252.5">留言距今不到</tspan><tspan x="268.6" textLength="13.3" lengthAdjust="spacing">10</tspan><tspan x="286 298.1 310.1 322.2 334.3 346.3 358.4 370.4 382.5 394.6 406.7 418.8 430.8 442.9 455 467.1">分鐘，該輪等待。編輯標題、描述或</tspan><tspan x="483.2" textLength="26.0" lengthAdjust="spacing">base</tspan><tspan x="509.2 521.3 533.4 545.5 557.6 569.7 581.8 593.9 605.9">，以及推送到堆疊式</tspan><tspan x="622" textLength="16.7" lengthAdjust="spacing">PR</tspan><tspan x="642.8 654.9 667 679.1 691.1 703.2 715.2 727.3 739.4 751.5 763.6 775.7 787.7 799.8 811.9 824">的父分支，會造成這種等待。推送到</tspan></text>
<text class="t-sub" y="119"><tspan x="192" textLength="16.7" lengthAdjust="spacing">PR</tspan><tspan x="212 224 236 248 260 272 284 296 308 320 332 344 356 368 380 392 404 416">分支從不等待。等待時間可用設定調整。</tspan></text>
</g>
<g data-box="32 148 816 56" data-left="170">
<rect class="raised" x="32" y="148" width="816" height="56" rx="6"/>
<circle class="chip" cx="56" cy="170" r="12"/>
<text class="t-chip" x="56" y="174" text-anchor="middle">2</text>
<text class="t-name" x="80" y="175" textLength="33.4" lengthAdjust="spacing">Scan</text>
<text class="t-sub" y="175" data-r="836"><tspan x="192">以</tspan><tspan x="209.8" textLength="94.0" lengthAdjust="spacing">sensitive-patterns</tspan><tspan x="309.7 322 334.3 346.6 359 371 383.3 395.6 407.9 420.2 432.5">檔比對標題、描述與關聯</tspan><tspan x="450.4" textLength="28.0" lengthAdjust="spacing">issue</tspan><tspan x="484.2 496.5 508.8 520.8 533.2 545.5 557.8 569.8 582.1 594.4 606.7 619 631.4 643.7 656 668 680.3 692.6 704.9 717.2 729.6 741.9 754.2 766.5 778.8">的文字。若命中，或掃描無法執行，貼出不含命中內容的</tspan><tspan x="796.7" textLength="39.4" lengthAdjust="spacing">Review</tspan></text>
<text class="t-sub" y="191"><tspan x="192" textLength="44.0" lengthAdjust="spacing">withheld</tspan><tspan x="239.3 251.3 263.4 275.4 287.4 299.4 311.4">通知，不審查該</tspan><tspan x="326.7" textLength="16.7" lengthAdjust="spacing">PR</tspan><tspan x="343.4 355.4 367.4 379.4 391.4 403.4 415.4 427.4">，也不呼叫模型。</tspan></text>
</g>
<g data-box="32 220 816 72" data-left="170">
<rect class="raised" x="32" y="220" width="816" height="72" rx="6"/>
<circle class="chip" cx="56" cy="242" r="12"/>
<text class="t-chip" x="56" y="246" text-anchor="middle">3</text>
<text class="t-name" x="80" y="247" textLength="35.0" lengthAdjust="spacing">Build</text>
<text class="t-sub" y="247" data-r="836"><tspan x="192 204">取出</tspan><tspan x="219.7" textLength="34.0" lengthAdjust="spacing">merge</tspan><tspan x="257.4" textLength="26.0" lengthAdjust="spacing">base</tspan><tspan x="283.4 295.4 307.5">，套用</tspan><tspan x="323.1" textLength="16.7" lengthAdjust="spacing">PR</tspan><tspan x="343.5" textLength="16.0" lengthAdjust="spacing">diff</tspan><tspan x="359.5 371.5 383.5 395.6 407.6 419.7 431.7 443.8 455.8">，再從預設分支複製</tspan><tspan x="471.5" textLength="68.7" lengthAdjust="spacing">CLAUDE.md</tspan><tspan x="540.1">、</tspan><tspan x="552.2" textLength="69.3" lengthAdjust="spacing">AGENTS.md</tspan><tspan x="625.2 637.3 649.3 661.3 673.4 685.4 697.5 709.5 721.5">與其他審查規則檔。</tspan><tspan x="733.6" textLength="16.7" lengthAdjust="spacing">PR</tspan><tspan x="753.9 766">超過</tspan><tspan x="781.6" textLength="26.7" lengthAdjust="spacing">2000</tspan><tspan x="812 824">行或</tspan></text>
<text class="t-sub" y="263" data-r="836"><tspan x="192" textLength="13.3" lengthAdjust="spacing">40</tspan><tspan x="208.9 220.9 232.9 244.9 256.9 268.9 281 293 305 317 329.1 341.1 353.1 365.1 377.1 389.1 401.2 413.2 425.2 437.2 449.2 461.2 473.3 485.3">個檔案時，貼出拆分請求，不審查。有三種例外：至少</tspan><tspan x="500.8" textLength="24.0" lengthAdjust="spacing">90%</tspan><tspan x="528.3 540.4 552.4 564.4 576.4 588.4">為刪除；只改</tspan><tspan x="603.9" textLength="21.3" lengthAdjust="spacing">lock</tspan><tspan x="625.3 637.3 649.3 661.4 673.4 685.4">、自動產生、</tspan><tspan x="697.4" textLength="48.7" lengthAdjust="spacing">snapshot</tspan><tspan x="749.6">或</tspan><tspan x="765.1" textLength="49.4" lengthAdjust="spacing">migration</tspan><tspan x="818 830">檔；</tspan></text>
<text class="t-sub" y="279"><tspan x="192 204 216">描述含</tspan><tspan x="231.3" class="t-code" textLength="93.9" lengthAdjust="spacing">split-exempt:</tspan><tspan x="328.5 340.5 352.5">段落。</tspan></text>
</g>
<g data-box="32 308 816 40" data-left="170">
<rect class="raised" x="32" y="308" width="816" height="40" rx="6"/>
<circle class="chip" cx="56" cy="330" r="12"/>
<text class="t-chip" x="56" y="334" text-anchor="middle">4</text>
<text class="t-name" x="80" y="335" textLength="32.7" lengthAdjust="spacing">Slice</text>
<text class="t-sub" y="335"><tspan x="192 204 216 228">變更超過</tspan><tspan x="243.3" textLength="20.0" lengthAdjust="spacing">300</tspan><tspan x="266.7 278.7 290.7 302.7 314.7 326.7">行時，切成約</tspan><tspan x="342" textLength="20.0" lengthAdjust="spacing">250</tspan><tspan x="365.3 377.3">行的</tspan><tspan x="392.7" textLength="16.0" lengthAdjust="spacing">diff</tspan><tspan x="412 424 436 448 460">區段，最多</tspan><tspan x="475.3">8</tspan><tspan x="485.3 497.3 509.3 521.3 533.3 545.3 557.3">個，同時審查。</tspan><tspan x="569.3" textLength="20.0" lengthAdjust="spacing">300</tspan><tspan x="592.7 604.7 616.7 628.7 640.7 652.7 664.7">行以下只有一個</tspan><tspan x="680" textLength="16.0" lengthAdjust="spacing">diff</tspan><tspan x="699.3 711.3 723.3">區段。</tspan></text>
</g>
<g class="focal" data-box="32 422 816 40" data-left="170">
<rect class="hero focal-r" x="32" y="422" width="816" height="40" rx="6"/>
<circle class="chip" cx="56" cy="444" r="12"/>
<text class="t-chip" x="56" y="448" text-anchor="middle">5</text>
<text class="t-name" x="80" y="449" textLength="48.2" lengthAdjust="spacing">Review</text>
<text class="t-sub" y="449"><tspan x="192" textLength="38.0" lengthAdjust="spacing">Claude</tspan><tspan x="233.3" textLength="28.7" lengthAdjust="spacing">Code</tspan><tspan x="265.4">以</tspan><tspan x="280.7" textLength="28.7" lengthAdjust="spacing">Read</tspan><tspan x="309.4">、</tspan><tspan x="321.4" textLength="26.7" lengthAdjust="spacing">Grep</tspan><tspan x="351.4">與</tspan><tspan x="366.7" textLength="25.3" lengthAdjust="spacing">Glob</tspan><tspan x="395.4 407.4">讀取</tspan><tspan x="422.7" textLength="46.0" lengthAdjust="spacing">worktree</tspan><tspan x="468.7 480.7">，無</tspan><tspan x="496" textLength="24.7" lengthAdjust="spacing">shell</tspan><tspan x="524 536 548 560 572 584 596 608">與網路工具。每個</tspan><tspan x="623.4" textLength="16.0" lengthAdjust="spacing">diff</tspan><tspan x="642.7 654.7 666.7 678.7 690.7 702.7 714.7 726.7">區段套用適用於該</tspan><tspan x="742" textLength="16.0" lengthAdjust="spacing">diff</tspan><tspan x="761.4 773.4 785.4 797.4 809.4 821.4">的檢查項目。</tspan></text>
</g>
<g data-box="32 478 816 56" data-left="170">
<rect class="raised" x="32" y="478" width="816" height="56" rx="6"/>
<circle class="chip" cx="56" cy="500" r="12"/>
<text class="t-chip" x="56" y="504" text-anchor="middle">6</text>
<text class="t-name" x="80" y="505" textLength="38.9" lengthAdjust="spacing">Verify</text>
<text class="t-sub" y="505" data-r="836"><tspan x="192 204.1 216.1 228.2 240.3 252.3 264.4 276.4 288.5 300.6 312.6">若問題引用的檔案既不在</tspan><tspan x="328.5" textLength="16.0" lengthAdjust="spacing">diff</tspan><tspan x="348.3 360.3 372.4 384.4 396.5">中，也不在</tspan><tspan x="412.3" textLength="16.7" lengthAdjust="spacing">PR</tspan><tspan x="432.8 444.9">專屬</tspan><tspan x="460.7" textLength="46.0" lengthAdjust="spacing">worktree</tspan><tspan x="510.6 522.6 534.6 546.7 558.7 570.8 582.9 594.9 606.9 619 631.1 643.1 655.2 667.2 679.3 691.4 703.4 715.5 727.6 739.6 751.7 763.7 775.8 787.9 799.9 811.9 824">中，捨棄該問題。每個會擋下核准的問題再呼叫一次模型，請</tspan></text>
<text class="t-sub" y="521"><tspan x="192 204 216 228 240 252 264 276 288 300 312 324">他再次檢查是否誤判，最多</tspan><tspan x="339.3">6</tspan><tspan x="349.3 361.3 373.3 385.3 397.3 409.3 421.3 433.3 445.3 457.3 469.3 481.3 493.3 505.3">次。模型推翻該問題的信心值達</tspan><tspan x="520.7" textLength="16.7" lengthAdjust="spacing">0.8</tspan><tspan x="540.7 552.7 564.7 576.7 588.7 600.7 612.7 624.7 636.7 648.7">以上，才移除該問題。</tspan></text>
</g>
<g data-box="32 580 816 56" data-left="170">
<rect class="raised" x="32" y="580" width="816" height="56" rx="6"/>
<circle class="chip" cx="56" cy="602" r="12"/>
<text class="t-chip" x="56" y="606" text-anchor="middle">7</text>
<text class="t-name" x="80" y="607" textLength="30.3" lengthAdjust="spacing">Post</text>
<text class="t-sub" y="607" data-r="836"><tspan x="192 204.1 216.2 228.3 240.5 252.6 264.7">讓模型文字中的</tspan><tspan x="280.9" textLength="32.7" lengthAdjust="spacing">HTML</tspan><tspan x="317.9 330 342">標籤、</tspan><tspan x="354.2">@</tspan><tspan x="370.6 382.7 394.9 407 419.1 431.2 443.3 455.4 467.4 479.5 491.7 503.8 515.9 528 540.1 552.2 564.3 576.5 588.6 600.7 612.7 624.8 636.9 649 661.1 673.3">提及與機器人指令，以及外觀像問題的行失效。留言先比對</tspan><tspan x="689.5" textLength="94.0" lengthAdjust="spacing">sensitive-patterns</tspan><tspan x="787.8 799.8 811.9 824">檔，再為</tspan></text>
<text class="t-sub" y="623"><tspan x="192 204 216 228">每個新的</tspan><tspan x="243.3" textLength="26.7" lengthAdjust="spacing">head</tspan><tspan x="273.3 285.3 297.3 309.3 321.3">貼出一則。</tspan></text>
</g>
<g data-box="24 660 832 72"><rect class="strip" x="24" y="660" width="832" height="72" rx="6"/><rect class="bar" x="24" y="660" width="6" height="72" rx="2"/><text class="t-title" x="44" y="684">失敗時不貼出。</text><text class="t-sub" y="704"><tspan x="44 56 68 80 92 104 116 128 140 152 164 176 188 200 212 224 236 248 260">無法解析的輸出，本輪不貼出任何留言。該</tspan><tspan x="275.3" textLength="16.7" lengthAdjust="spacing">PR</tspan><tspan x="295.3 307.3 319.3 331.3 343.3 355.3 367.3 379.3 391.3 403.3 415.3 427.3 439.3 451.3 463.3 475.3 487.3 499.3 511.3 523.3 535.3 547.3 559.3 571.3 583.3 595.3 607.3 619.3 631.3 643.3 655.3 667.3">稍後重試。貼出失敗的審查結果會保留，下次不重新審查，只重新貼出。</tspan></text></g>
</g>
</svg>
