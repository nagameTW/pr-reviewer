<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" role="img" aria-labelledby="t d">
  <title id="t">What it checks</title>
  <desc id="d">The checklist every slice is reviewed against, in four groups. Does it work?: 1 Correctness (Bugs, unhandled inputs, callers a change breaks), 12 Half-fixes (The same defect still alive somewhere else), 5 Tests (Weakened CI, a fix with no test, weak asserts). Is it safe?: 2 Security (Attacker input traced to a sink; missing authz), 3 Sensitive data (Real IPs, hostnames, MACs, tokens), 2b AI-agent security (Prompt injection, raw model output, no timeout), 10 LLM tool surface (Unlisted or overbroad tools, no approval). Does it fit the repo?: 4 Project constraints (Rules the repo writes down for itself), 6 Design (Over-engineering, code in the wrong place), 7 Docs in sync (Docs still describing the old behavior), 8 Dependencies (Undeclared, or pinned unlike the rest). Is it proven?: 9 Evidence (Heuristic or prompt changes, unmeasured), 11 Acceptance (Does the diff deliver what the issue asked). Dashed items are checked only when they apply: 2b when the diff touches LLM code, 9 when it changes a heuristic, a limit, a model choice or a prompt, 10 when it defines or changes tools a model can call, 11 when the PR links an issue. Not reported: denial of service except a call with no timeout, memory safety in a memory-safe language, vulnerabilities with no exploit path, style a linter enforces, praise.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3B4252; }
    .group { font-size: 15px; font-weight: 700; fill: #2E3440; }
    .name { font-size: 13px; font-weight: 700; fill: #2E3440; }
    .lbl { font-size: 11.5px; fill: #4C566A; }
    .num { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    .card { fill: #ECEFF4; stroke: #81A1C1; stroke-width: 1.5; }
    .item { fill: #FFFFFF; stroke: #81A1C1; stroke-width: 1.2; }
    .when { fill: #FFFFFF; stroke: #81A1C1; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .badge { fill: #4C566A; }
    .acc { fill: #BF616A; }
  </style>
  <rect x="1" y="1" width="978" height="458" rx="14" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="2"/>

  <!-- Does it work? -->
  <rect class="card" x="24" y="24" width="221" height="320" rx="12"/>
  <text class="group" x="40" y="52">Does it work?</text>
  <rect class="item" x="34" y="68" width="201" height="60" rx="8"/>
  <circle class="badge" cx="56" cy="88" r="11"/><text class="num" x="56" y="92" text-anchor="middle">1</text>
  <text class="name" x="74" y="92">Correctness</text>
  <text class="lbl" x="74" y="108">Bugs, unhandled inputs,</text>
  <text class="lbl" x="74" y="122">callers a change breaks</text>
  <rect class="item" x="34" y="136" width="201" height="60" rx="8"/>
  <circle class="badge" cx="56" cy="156" r="11"/><text class="num" x="56" y="160" text-anchor="middle">12</text>
  <text class="name" x="74" y="160">Half-fixes</text>
  <text class="lbl" x="74" y="176">The same defect still</text>
  <text class="lbl" x="74" y="190">alive somewhere else</text>
  <rect class="item" x="34" y="204" width="201" height="60" rx="8"/>
  <circle class="badge" cx="56" cy="224" r="11"/><text class="num" x="56" y="228" text-anchor="middle">5</text>
  <text class="name" x="74" y="228">Tests</text>
  <text class="lbl" x="74" y="244">Weakened CI, a fix with</text>
  <text class="lbl" x="74" y="258">no test, weak asserts</text>

  <!-- Is it safe? -->
  <rect class="card" x="261" y="24" width="221" height="320" rx="12"/>
  <text class="group" x="277" y="52">Is it safe?</text>
  <rect class="item" x="271" y="68" width="201" height="60" rx="8"/>
  <circle class="badge" cx="293" cy="88" r="11"/><text class="num" x="293" y="92" text-anchor="middle">2</text>
  <text class="name" x="311" y="92">Security</text>
  <text class="lbl" x="311" y="108">Attacker input traced to</text>
  <text class="lbl" x="311" y="122">a sink; missing authz</text>
  <rect class="item" x="271" y="136" width="201" height="60" rx="8"/>
  <circle class="badge" cx="293" cy="156" r="11"/><text class="num" x="293" y="160" text-anchor="middle">3</text>
  <text class="name" x="311" y="160">Sensitive data</text>
  <text class="lbl" x="311" y="176">Real IPs, hostnames,</text>
  <text class="lbl" x="311" y="190">MACs, tokens</text>
  <rect class="when" x="271" y="204" width="201" height="60" rx="8"/>
  <circle class="badge" cx="293" cy="224" r="11"/><text class="num" x="293" y="228" text-anchor="middle">2b</text>
  <text class="name" x="311" y="228">AI-agent security</text>
  <text class="lbl" x="311" y="244">Prompt injection, raw</text>
  <text class="lbl" x="311" y="258">model output, no timeout</text>
  <rect class="when" x="271" y="272" width="201" height="60" rx="8"/>
  <circle class="badge" cx="293" cy="292" r="11"/><text class="num" x="293" y="296" text-anchor="middle">10</text>
  <text class="name" x="311" y="296">LLM tool surface</text>
  <text class="lbl" x="311" y="312">Unlisted or overbroad</text>
  <text class="lbl" x="311" y="326">tools, no approval</text>

  <!-- Does it fit the repo? -->
  <rect class="card" x="498" y="24" width="221" height="320" rx="12"/>
  <text class="group" x="514" y="52">Does it fit the repo?</text>
  <rect class="item" x="508" y="68" width="201" height="60" rx="8"/>
  <circle class="badge" cx="530" cy="88" r="11"/><text class="num" x="530" y="92" text-anchor="middle">4</text>
  <text class="name" x="548" y="92">Project constraints</text>
  <text class="lbl" x="548" y="108">Rules the repo writes</text>
  <text class="lbl" x="548" y="122">down for itself</text>
  <rect class="item" x="508" y="136" width="201" height="60" rx="8"/>
  <circle class="badge" cx="530" cy="156" r="11"/><text class="num" x="530" y="160" text-anchor="middle">6</text>
  <text class="name" x="548" y="160">Design</text>
  <text class="lbl" x="548" y="176">Over-engineering, code</text>
  <text class="lbl" x="548" y="190">in the wrong place</text>
  <rect class="item" x="508" y="204" width="201" height="60" rx="8"/>
  <circle class="badge" cx="530" cy="224" r="11"/><text class="num" x="530" y="228" text-anchor="middle">7</text>
  <text class="name" x="548" y="228">Docs in sync</text>
  <text class="lbl" x="548" y="244">Docs still describing</text>
  <text class="lbl" x="548" y="258">the old behavior</text>
  <rect class="item" x="508" y="272" width="201" height="60" rx="8"/>
  <circle class="badge" cx="530" cy="292" r="11"/><text class="num" x="530" y="296" text-anchor="middle">8</text>
  <text class="name" x="548" y="296">Dependencies</text>
  <text class="lbl" x="548" y="312">Undeclared, or pinned</text>
  <text class="lbl" x="548" y="326">unlike the rest</text>

  <!-- Is it proven? -->
  <rect class="card" x="735" y="24" width="221" height="320" rx="12"/>
  <text class="group" x="751" y="52">Is it proven?</text>
  <rect class="when" x="745" y="68" width="201" height="60" rx="8"/>
  <circle class="badge" cx="767" cy="88" r="11"/><text class="num" x="767" y="92" text-anchor="middle">9</text>
  <text class="name" x="785" y="92">Evidence</text>
  <text class="lbl" x="785" y="108">Heuristic or prompt</text>
  <text class="lbl" x="785" y="122">changes, unmeasured</text>
  <rect class="when" x="745" y="136" width="201" height="60" rx="8"/>
  <circle class="badge" cx="767" cy="156" r="11"/><text class="num" x="767" y="160" text-anchor="middle">11</text>
  <text class="name" x="785" y="160">Acceptance</text>
  <text class="lbl" x="785" y="176">Does the diff deliver</text>
  <text class="lbl" x="785" y="190">what the issue asked</text>
  <rect class="when" x="745" y="216" width="30" height="18" rx="5"/>
  <text class="lbl" x="783" y="229">only when it applies:</text>
  <text class="lbl" x="747" y="254">2b: the diff touches LLM code</text>
  <text class="lbl" x="747" y="271">9: heuristics, models, prompts</text>
  <text class="lbl" x="747" y="288">10: it defines or changes tools</text>
  <text class="lbl" x="767" y="303">a model can call</text>
  <text class="lbl" x="747" y="320">11: the PR links an issue</text>

  <!-- not reported -->
  <rect class="card" x="24" y="360" width="932" height="76" rx="10"/>
  <rect class="acc" x="24" y="360" width="6" height="76" rx="3"/>
  <text class="name" x="46" y="384">Not reported</text>
  <text class="lbl" x="46" y="404">Denial of service, except a call with no timeout (that one is reported) · memory safety in a memory-safe language</text>
  <text class="lbl" x="46" y="421">Vulnerabilities with no exploit path · style a linter already enforces · praise</text>
</svg>
