<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 892 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-github-dark-title overview-github-dark-desc" id="overview-github-dark-root">
<title id="overview-github-dark-title">Where pr-reviewer runs</title>
<desc id="overview-github-dark-desc">pr-reviewer runs on your machine, reads open pull requests through gh, has Claude Code review a per-PR worktree with read-only tools, scans text against your sensitive-patterns file, and posts one comment per new head.</desc>
<defs>
      <style>#overview-github-dark-root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #F0F6FC; }
