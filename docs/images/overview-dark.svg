      #overview-github-dark-root .bar { fill: #DA3633; }
      #overview-github-dark-root .alert-node { fill: #0D1117; stroke: #DA3633; stroke-width: 2; stroke-dasharray: 6 4; }
      #overview-github-dark-root .edge { fill: none; stroke: #4493F8; stroke-width: 1.6; }
      #overview-github-dark-root .edge-dash { fill: none; stroke: #4493F8; stroke-width: 1.4; stroke-dasharray: 5 4; }
      #overview-github-dark-root .edge-alert { fill: none; stroke: #DA3633; stroke-width: 1.6; }
      #overview-github-dark-root .mk { fill: #4493F8; }
      #overview-github-dark-root .mk-alert { fill: #DA3633; }
      #overview-github-dark-root .chip { fill: #F0F6FC; }
      #overview-github-dark-root .dot { fill: #F0F6FC; }
      #overview-github-dark-root .bullet { fill: #9198A1; }
      #overview-github-dark-root .diamond { fill: #0D1117; stroke: #656C76; stroke-width: 1.4; }</style>
