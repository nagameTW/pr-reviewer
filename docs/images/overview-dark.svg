<rect class="mask" x="654" y="182" width="56" height="16" rx="2"/><text class="t-arrow" x="682" y="194" text-anchor="middle">PROMPT</text>
<rect class="mask" x="658" y="242" width="48" height="16" rx="2"/><text class="t-arrow" x="682" y="254" text-anchor="middle">REPLY</text>
