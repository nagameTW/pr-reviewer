      #overview-github-dark-root .t-arrow { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .06em; fill: #9198A1; }
      #overview-github-dark-root .t-alert { fill: #F85149; font-weight: 700; }
      #overview-github-dark-root .t-chip { fill: #0D1117; font-weight: 700; }
      #overview-github-dark-root .t-title { font-size: 14px; font-weight: 700; }
      #overview-github-dark-root .mask { fill: #0D1117; }
      #overview-github-dark-root .node { fill: #151B23; stroke: #656C76; stroke-width: 1.2; }
