      #overview-github-dark-root text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F0F6FC; font-size: 12px; }
      #overview-github-dark-root .t-name { font-size: 14px; font-weight: 600; }
      #overview-github-dark-root .t-name-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; }
