<g data-box="24 156 180 112">
<rect class="node" x="24" y="156" width="180" height="112" rx="6"/>
<text class="t-name" x="36" y="178" textLength="80.1" lengthAdjust="spacing">Pull request</text>
<text class="t-sub" y="198" data-r="192"><tspan x="36" textLength="30.0" lengthAdjust="spacing">open,</tspan><tspan x="70.3" textLength="16.7" lengthAdjust="spacing">not</tspan><tspan x="91.3">a</tspan><tspan x="102.3" textLength="27.3" lengthAdjust="spacing">draft,</tspan><tspan x="134" textLength="20.0" lengthAdjust="spacing">and</tspan><tspan x="158.3" textLength="9.3" lengthAdjust="spacing">in</tspan><tspan x="172" textLength="20.0" lengthAdjust="spacing">one</tspan></text>
<text class="t-sub" y="214" data-r="192"><tspan x="36" textLength="10.0" lengthAdjust="spacing">of</tspan><tspan x="52" textLength="16.7" lengthAdjust="spacing">the</tspan><tspan x="74.7" textLength="30.0" lengthAdjust="spacing">repos</tspan><tspan x="110.7" textLength="20.0" lengthAdjust="spacing">that</tspan><tspan x="136.7" textLength="19.3" lengthAdjust="spacing">you</tspan><tspan x="162" textLength="14.7" lengthAdjust="spacing">list</tspan><tspan x="182.7" textLength="9.3" lengthAdjust="spacing">in</tspan></text>
<text class="t-sub" y="230"><tspan x="36" class="t-code" textLength="137.2" lengthAdjust="spacing">PRREVIEW_GATE_REPOS</tspan></text>
</g>
<g data-box="292 92 336 56">
<rect class="raised" x="292" y="92" width="336" height="56" rx="6"/>
<text class="t-name-code" x="304" y="114">review-loop.sh</text>
<text class="t-sub" y="134"><tspan x="304" textLength="24.7" lengthAdjust="spacing">polls</tspan><tspan x="332" textLength="26.0" lengthAdjust="spacing">once</tspan><tspan x="361.3">a</tspan><tspan x="371.3" textLength="36.0" lengthAdjust="spacing">minute</tspan><tspan x="410.7" textLength="27.4" lengthAdjust="spacing">while</tspan><tspan x="441.4">a</tspan><tspan x="451.4" textLength="16.7" lengthAdjust="spacing">PR</tspan><tspan x="471.4" textLength="8.7" lengthAdjust="spacing">is</tspan><tspan x="483.4" textLength="26.7" lengthAdjust="spacing">open</tspan></text>
</g>
<g data-box="292 172 336 80">
<rect class="raised" x="292" y="172" width="336" height="80" rx="6"/>
<text class="t-name-code" x="304" y="194">pr-autoreview.sh</text>
<text class="t-sub" y="214" data-r="616"><tspan x="304" textLength="20.0" lengthAdjust="spacing">one</tspan><tspan x="328.4" textLength="34.0" lengthAdjust="spacing">round:</tspan><tspan x="366.7" textLength="26.0" lengthAdjust="spacing">each</tspan><tspan x="397.1" textLength="22.0" lengthAdjust="spacing">new</tspan><tspan x="423.5" textLength="26.7" lengthAdjust="spacing">head</tspan><tspan x="454.5" textLength="22.7" lengthAdjust="spacing">gets</tspan><tspan x="481.5" textLength="20.0" lengthAdjust="spacing">one</tspan><tspan x="505.9" textLength="38.0" lengthAdjust="spacing">review.</tspan><tspan x="548.3" textLength="15.3" lengthAdjust="spacing">Up</tspan><tspan x="567.9" textLength="10.0" lengthAdjust="spacing">to</tspan><tspan x="582.3">2</tspan><tspan x="593.3" textLength="22.7" lengthAdjust="spacing">PRs</tspan></text>
<text class="t-sub" y="230"><tspan x="304" textLength="10.0" lengthAdjust="spacing">at</tspan><tspan x="317.3" textLength="16.7" lengthAdjust="spacing">the</tspan><tspan x="337.3" textLength="29.3" lengthAdjust="spacing">same</tspan><tspan x="370" textLength="26.0" lengthAdjust="spacing">time.</tspan></text>
</g>
<g data-box="292 276 160 88">
<rect class="raised" x="292" y="276" width="160" height="88" rx="6"/>
<text class="t-name" x="304" y="298" textLength="108.9" lengthAdjust="spacing">Per-PR worktree</text>
<text class="t-sub" y="318" data-r="440"><tspan x="304" textLength="34.0" lengthAdjust="spacing">merge</tspan><tspan x="346.3" textLength="26.0" lengthAdjust="spacing">base</tspan><tspan x="380.5">+</tspan><tspan x="395.8" textLength="16.7" lengthAdjust="spacing">PR</tspan><tspan x="420.7" textLength="19.3" lengthAdjust="spacing">diff,</tspan></text>
<text class="t-sub" y="334" data-r="440"><tspan x="304" textLength="22.0" lengthAdjust="spacing">plus</tspan><tspan x="332.5" textLength="26.0" lengthAdjust="spacing">rules</tspan><tspan x="365" textLength="21.3" lengthAdjust="spacing">files</tspan><tspan x="392.8" textLength="24.0" lengthAdjust="spacing">from</tspan><tspan x="423.3" textLength="16.7" lengthAdjust="spacing">the</tspan></text>
<text class="t-sub" y="350"><tspan x="304" textLength="36.0" lengthAdjust="spacing">default</tspan><tspan x="343.3" textLength="36.7" lengthAdjust="spacing">branch</tspan></text>
</g>
<g data-box="468 276 160 88">
<rect class="raised" x="468" y="276" width="160" height="88" rx="6"/>
<text class="t-name" x="480" y="298" textLength="120.6" lengthAdjust="spacing">Sensitive patterns</text>
<text class="t-sub" y="318" data-r="616"><tspan x="480" textLength="23.3" lengthAdjust="spacing">your</tspan><tspan x="507" textLength="30.0" lengthAdjust="spacing">regex</tspan><tspan x="540.7" textLength="18.0" lengthAdjust="spacing">list.</tspan><tspan x="562.3" textLength="33.3" lengthAdjust="spacing">Scans</tspan><tspan x="599.3" textLength="16.7" lengthAdjust="spacing">PR</tspan></text>
<text class="t-sub" y="334"><tspan x="480" textLength="19.3" lengthAdjust="spacing">text</tspan><tspan x="502.7" textLength="20.0" lengthAdjust="spacing">and</tspan><tspan x="526" textLength="26.0" lengthAdjust="spacing">each</tspan><tspan x="555.3" textLength="49.3" lengthAdjust="spacing">comment</tspan></text>
</g>
<g data-box="716 156 152 112">
<rect class="node" x="716" y="156" width="152" height="112" rx="6"/>
<text class="t-name" x="728" y="178" textLength="85.6" lengthAdjust="spacing">Claude Code</text>
<text class="t-sub" y="198" data-r="856"><tspan x="728" class="t-code" textLength="43.3" lengthAdjust="spacing">claude</tspan><tspan x="781" class="t-code" textLength="14.4" lengthAdjust="spacing">-p</tspan><tspan x="795.5">,</tspan><tspan x="804.6" textLength="51.4" lengthAdjust="spacing">headless.</tspan></text>
<text class="t-sub" y="214" data-r="856"><tspan x="728" textLength="32.0" lengthAdjust="spacing">Read,</tspan><tspan x="769.1" textLength="30.0" lengthAdjust="spacing">Grep,</tspan><tspan x="808.2" textLength="25.3" lengthAdjust="spacing">Glob</tspan><tspan x="842.7" textLength="13.3" lengthAdjust="spacing">on</tspan></text>
<text class="t-sub" y="230" data-r="856"><tspan x="728" textLength="16.7" lengthAdjust="spacing">the</tspan><tspan x="752.9" textLength="46.0" lengthAdjust="spacing">worktree</tspan><tspan x="807.1" textLength="25.3" lengthAdjust="spacing">only.</tspan><tspan x="840.7" textLength="15.3" lengthAdjust="spacing">No</tspan></text>
<text class="t-sub" y="246"><tspan x="728" textLength="28.0" lengthAdjust="spacing">shell,</tspan><tspan x="759.3" textLength="13.3" lengthAdjust="spacing">no</tspan><tspan x="776" textLength="25.3" lengthAdjust="spacing">web.</tspan></text>
</g>
<g data-box="24 412 414 120">
<rect class="optional" x="24" y="412" width="414" height="120" rx="6"/>
<text class="t-title" x="40" y="436" textLength="281.5" lengthAdjust="spacing">Fork PRs from untrusted authors: skipped</text>
<text class="t-sub" y="456" data-r="422"><tspan x="40">A</tspan><tspan x="51.9" textLength="20.0" lengthAdjust="spacing">fork</tspan><tspan x="75.7" textLength="16.7" lengthAdjust="spacing">PR</tspan><tspan x="96.3" textLength="24.0" lengthAdjust="spacing">from</tspan><tspan x="124.1" textLength="13.3" lengthAdjust="spacing">an</tspan><tspan x="141.3" textLength="34.0" lengthAdjust="spacing">author</tspan><tspan x="179.2" textLength="19.3" lengthAdjust="spacing">you</tspan><tspan x="202.4" textLength="13.3" lengthAdjust="spacing">do</tspan><tspan x="219.6" textLength="16.7" lengthAdjust="spacing">not</tspan><tspan x="240.1" textLength="23.3" lengthAdjust="spacing">trust</tspan><tspan x="267.3" textLength="8.7" lengthAdjust="spacing">is</tspan><tspan x="279.8" textLength="48.0" lengthAdjust="spacing">reviewed</tspan><tspan x="331.7" textLength="22.0" lengthAdjust="spacing">only</tspan><tspan x="357.6" textLength="6.0" lengthAdjust="spacing">if</tspan><tspan x="367.5" textLength="16.7" lengthAdjust="spacing">the</tspan><tspan x="388" textLength="34.0" lengthAdjust="spacing">author</tspan></text>
<text class="t-sub" y="472" data-r="422"><tspan x="40" textLength="8.7" lengthAdjust="spacing">is</tspan><tspan x="52.7" textLength="9.3" lengthAdjust="spacing">in</tspan><tspan x="66" class="t-code" textLength="209.4" lengthAdjust="spacing">PRREVIEW_GATE_TRUSTED_AUTHORS</tspan><tspan x="275.4">,</tspan><tspan x="282.8" textLength="19.3" lengthAdjust="spacing">you</tspan><tspan x="306.1" textLength="17.3" lengthAdjust="spacing">run</tspan><tspan x="327.5" class="t-code" textLength="57.8" lengthAdjust="spacing">prreview</tspan><tspan x="393.1" class="t-code" textLength="28.9" lengthAdjust="spacing">once</tspan></text>
<text class="t-sub" y="488"><tspan x="40" class="t-code" textLength="28.9" lengthAdjust="spacing">--pr</tspan><tspan x="68.9">,</tspan><tspan x="75.5" textLength="10.7" lengthAdjust="spacing">or</tspan><tspan x="89.5" textLength="19.3" lengthAdjust="spacing">you</tspan><tspan x="112.2" textLength="16.0" lengthAdjust="spacing">set</tspan><tspan x="131.5" class="t-code" textLength="173.3" lengthAdjust="spacing">PRREVIEW_GATE_FORK_PRS=1</tspan><tspan x="304.8">.</tspan></text>
</g>
<g data-box="454 412 414 120">
<rect class="strip" x="454" y="412" width="414" height="120" rx="6"/>
<rect class="bar" x="454" y="412" width="6" height="120" rx="2"/>
<text class="t-title" x="474" y="436" textLength="191.3" lengthAdjust="spacing">It never approves or merges.</text>
<text class="t-sub" y="456" data-r="852"><tspan x="474" textLength="12.7" lengthAdjust="spacing">Its</tspan><tspan x="497.2" textLength="22.0" lengthAdjust="spacing">only</tspan><tspan x="529.8" textLength="34.0" lengthAdjust="spacing">merge</tspan><tspan x="574.3" textLength="18.0" lengthAdjust="spacing">call</tspan><tspan x="602.9" textLength="8.7" lengthAdjust="spacing">is</tspan><tspan x="622.1" class="t-code" textLength="14.4" lengthAdjust="spacing">gh</tspan><tspan x="651" class="t-code" textLength="14.4" lengthAdjust="spacing">pr</tspan><tspan x="679.8" class="t-code" textLength="36.1" lengthAdjust="spacing">merge</tspan><tspan x="730.4" class="t-code" textLength="101.1" lengthAdjust="spacing">--disable-auto</tspan><tspan x="831.5">.</tspan><tspan x="845.3" textLength="6.7" lengthAdjust="spacing">It</tspan></text>
<text class="t-sub" y="472" data-r="852"><tspan x="474" textLength="26.7" lengthAdjust="spacing">turns</tspan><tspan x="511.1" textLength="13.3" lengthAdjust="spacing">off</tspan><tspan x="534.8" textLength="61.4" lengthAdjust="spacing">auto-merge</tspan><tspan x="606.5" textLength="41.3" lengthAdjust="spacing">(GitHub</tspan><tspan x="658.3" textLength="43.4" lengthAdjust="spacing">merging</tspan><tspan x="712">a</tspan><tspan x="729.1" textLength="16.7" lengthAdjust="spacing">PR</tspan><tspan x="756.1" textLength="13.3" lengthAdjust="spacing">on</tspan><tspan x="779.9" textLength="12.0" lengthAdjust="spacing">its</tspan><tspan x="802.3" textLength="26.0" lengthAdjust="spacing">own)</tspan><tspan x="838.7" textLength="13.3" lengthAdjust="spacing">on</tspan></text>
<text class="t-sub" y="488" data-r="852"><tspan x="474">a</tspan><tspan x="489.9" textLength="26.7" lengthAdjust="spacing">head</tspan><tspan x="525.9" textLength="20.0" lengthAdjust="spacing">that</tspan><tspan x="555.1" textLength="16.7" lengthAdjust="spacing">the</tspan><tspan x="581.1" textLength="45.4" lengthAdjust="spacing">reviewer</tspan><tspan x="635.7" textLength="19.3" lengthAdjust="spacing">has</tspan><tspan x="664.3" textLength="16.7" lengthAdjust="spacing">not</tspan><tspan x="690.2" textLength="51.4" lengthAdjust="spacing">reviewed.</tspan><tspan x="750.9" textLength="6.7" lengthAdjust="spacing">It</tspan><tspan x="766.8" textLength="23.3" lengthAdjust="spacing">runs</tspan><tspan x="799.4" textLength="22.0" lengthAdjust="spacing">only</tspan><tspan x="830.7" textLength="21.3" lengthAdjust="spacing">with</tspan></text>
<text class="t-sub" y="504" data-r="852"><tspan x="474" class="t-code" textLength="238.3" lengthAdjust="spacing">PRREVIEW_GATE_DISARM_AUTO_MERGE=1</tspan><tspan x="712.3">.</tspan><tspan x="720.6">A</tspan><tspan x="733.6" textLength="35.3" lengthAdjust="spacing">verdict</tspan><tspan x="774" textLength="8.7" lengthAdjust="spacing">is</tspan><tspan x="787.6">a</tspan><tspan x="799.3" textLength="52.7" lengthAdjust="spacing">comment,</tspan></text>
<text class="t-sub" y="520"><tspan x="474" textLength="16.7" lengthAdjust="spacing">not</tspan><tspan x="494">a</tspan><tspan x="504" textLength="37.3" lengthAdjust="spacing">GitHub</tspan><tspan x="544.7" textLength="49.4" lengthAdjust="spacing">approval.</tspan></text>
</g>
</g>
