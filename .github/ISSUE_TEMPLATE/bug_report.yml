name: Bug report
description: The reviewer did something wrong, or failed to run.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing this. If the problem is that a review missed a bug or
        raised a false finding, say so under "What happened" and include the
        finding text; that is useful too.

        Redact tokens, hostnames and anything your sensitive-patterns file
        would catch before you paste logs.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
      placeholder: The round exited 1 with "claude missing" although `claude --version` works in my shell.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The command you ran, the settings you changed, and the kind of pull request involved.
      placeholder: |
        1. export PRREVIEW_GATE_REPOS="me/repo"
        2. bash pr-autoreview.sh
        3. ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: pr-reviewer commit
      description: Output of `git rev-parse --short HEAD` in your checkout.
      placeholder: 1a2b3c4
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and bash version
      description: For example the output of `uname -sr` and `bash --version | head -1`.
      placeholder: Linux 6.x or macOS 15, GNU bash 5.x
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: gh and Claude Code versions
      placeholder: gh 2.x, claude 2.x
  - type: textarea
    id: settings
    attributes:
      label: Settings you changed
      description: Every `PRREVIEW_*` variable you set, except the repo list if it is private.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Round output
      description: The relevant lines of the round's output. Redact first.
      render: text
